version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:12-alpine
    container_name: shopsmart-db
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: shopsmart-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Internal API (for SSRF flags) - runs in Docker for isolation
  internal-api:
    image: node:20-alpine
    container_name: shopsmart-internal-api
    environment:
      SSRF_FLAG: "PCTFS{ssrf_internal_service_reached}"
    volumes:
      - ./infra/internal-api.js:/app/server.js:ro
    command: node /app/server.js
    ports:
      - "5000:5000"

volumes:
  postgres_data:
