version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:12-alpine
    container_name: shopsmart-db
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shopsmart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: shopsmart-redis
    ports:
      - "6379:6379"
    networks:
      - shopsmart-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API
  api:
    build:
      context: ./be
      dockerfile: ../infra/docker/Dockerfile.api
      network: host
    container_name: shopsmart-api
    environment:
      DATABASE_URL: postgresql://shop:shop@db:5432/shop
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: production_secret_change_me
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:3001
      # Mass Assignment Flag
      MASS_ASSIGNMENT_FLAG: "PCTFS{mass_assignment_privilege_escalation}"
      # SSTI Flags
      SHOPSMART_FLAG: "PCTFS{ssti_invoice_template_injection}"
      SSTI_EMAIL_FLAG: "PCTFS{ssti_email_template_displayname}"
      # Vulnerable Component Flags
      VULN_COMPONENT_FLAG: "PCTFS{eval_debug_console_rce}"
      PILLOW_FLAG: "PCTFS{pillow_8_1_0_buffer_overflow_memory_leak}"
      # SSRF Flag
      SSRF_FLAG: "PCTFS{ssrf_internal_service_reached}"
      # Config values for leak test
      ADMIN_EMAIL: "admin@shopsmart.com"
      ADMIN_PASSWORD: "SuperSecretAdminPass123"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./be:/app
      - /app/node_modules
      - ./secrets:/app/secrets:ro
    networks:
      - shopsmart-network
    command: npm run dev

  # Internal API (for SSRF flags)
  internal-api:
    image: node:20-alpine
    container_name: shopsmart-internal-api
    environment:
      SSRF_FLAG: "PCTFS{ssrf_internal_service_reached}"
    volumes:
      - ./infra/internal-api.js:/app/server.js:ro
    command: node /app/server.js
    networks:
      - shopsmart-network
    expose:
      - "5000"

  # Frontend
  web:
    build:
      context: ./fe
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: shopsmart-web
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:4000
    depends_on:
      - api
    ports:
      - "3001:3000"
    volumes:
      - ./fe:/app
      - /app/node_modules
      - /app/.next
      - ./fe-public-secrets:/app/.git:ro
    networks:
      - shopsmart-network
    command: npm run dev

  # Nginx Reverse Proxy
  nginx:
    image: nginx:stable-alpine
    container_name: shopsmart-nginx
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fe/public:/usr/share/nginx/html/public:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    networks:
      - shopsmart-network

  # Decoy FTP and idle listeners
  decoy-ftp:
    build:
      context: ./infra/decoy
    container_name: shopsmart-decoy
    environment:
      FAKE_FTP_PORT: "21"
      DECOY_PORTS: "21,2121,2323,5001,64000"
    ports:
      - "21:21"
      - "2121:2121"
      - "2323:2323"
      - "5001:5001"
      - "64000:64000"
    networks:
      - shopsmart-network

networks:
  shopsmart-network:
    driver: bridge

volumes:
  postgres_data:
