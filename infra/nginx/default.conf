# ShopSmart Nginx Configuration
# Intentionally misconfigured for security testing

server {
    listen 80;
    server_name localhost;

    # Security headers (intentionally weak)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Frontend - Next.js
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Backend API
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # VULNERABILITY: Expose .git directory (Sensitive Data Exposure)
    # This should be blocked but intentionally allows access
    location ~ /\.git {
        # Normally this would return 403, but we allow it for the CTF
        alias /usr/share/nginx/html/public/.git;
        autoindex on;
    }

    # VULNERABILITY: Expose backup files
    location ~ \.(bak|backup|old|sql)$ {
        # Should be denied, but intentionally accessible
        root /usr/share/nginx/html;
    }

    # Static files
    location /public/ {
        alias /usr/share/nginx/html/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}




